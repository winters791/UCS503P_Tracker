# One-command local deployment:  docker compose up --build
#   frontend -> http://localhost:5173    API docs -> http://localhost:8000/docs
# Load the demo week:  docker compose exec backend python seed.py --reset
services:
  backend:
    build: ./code
    ports:
      - "8000:8000"
    volumes:
      - ops-data:/data
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  ops-data:
